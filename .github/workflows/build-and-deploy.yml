name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build single-file timetable picker
        run: npm run build

      - name: Generate and commit offline HTML
        run: |
          cp dist/index.html vsb-timetable-picker-offline.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vsb-timetable-picker-offline.html
          if ! git diff --staged --quiet; then
            git commit -m "chore: offline build [skip ci]"
            git push
          fi

      - name: Update offline GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete offline-latest --cleanup-tag -y || true
          gh release create offline-latest vsb-timetable-picker-offline.html \
            --title "Offline verze (vsb-timetable-picker-offline.html)" \
            --notes "Automaticky vygenerovaná offline verze aplikace VŠB Timetable Picker." \
            --latest

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

